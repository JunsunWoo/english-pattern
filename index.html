<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영어패턴">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>영어패턴 매일 학습</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface2: #f0eee9; --text: #1c1c1e; --muted: #6e6e73; --line: #e6e3dd;
    --accent: #2b59c3; --accent-soft: #e8eefb; --green: #1f8a4c; --green-soft: #e2f4e9; --red: #c93c3c; --red-soft: #fbe9e9;
    --amber: #a86a0c; --amber-soft: #fbf1df;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
    --r: 18px; --tabh: 58px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #1c1c1f; --surface2: #2a2a2e; --text: #f2f2f7; --muted: #9b9ba2; --line: #2e2e33;
      --accent: #7ea2ff; --accent-soft: #1f2a46; --green: #4cc47e; --green-soft: #173324; --red: #ff7b7b; --red-soft: #3a1c1c;
      --amber: #f0b45a; --amber-soft: #3a2d16;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 72px); word-break: keep-all; overflow-wrap: anywhere; }
  body.no-tabs { padding-bottom: 32px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  select, input { font: inherit; color: inherit; }
  svg { display: block; }
  #app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px 16px; }

  h1 { font-size: 30px; line-height: 1.2; margin: 2px 0 10px; letter-spacing: -.02em; }
  h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  .top { padding: 6px 2px 2px; }
  .top .date { color: var(--muted); font-size: 14px; font-weight: 600; }
  .muted { color: var(--muted); } .sm { font-size: 13px; }
  .label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 4px; }
  .big small { font-size: 16px; font-weight: 700; margin-left: 2px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .card { background: var(--surface); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .grid2 .card { margin: 0; }
  .tile { display: block; text-align: left; width: 100%; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; line-height: 1.5; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 13px; background: var(--surface2); font-weight: 650; font-size: 16px; white-space: nowrap; }
  .btn.sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.good { background: var(--green); color: #fff; }
  .btn.block { display: flex; width: 100%; margin-top: 14px; }
  .btn.on { background: var(--accent-soft); color: var(--accent); }
  .btn.danger { color: var(--red); }
  .btn:active, .opt:active, .tile:active, .prow:active { transform: scale(.985); }
  .btn:disabled { opacity: .45; }

  .play { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .play svg { width: 17px; height: 17px; margin-left: 2px; }
  .play.lg { width: 58px; height: 58px; } .play.lg svg { width: 24px; height: 24px; }
  .play.sm { width: 32px; height: 32px; } .play.sm svg { width: 13px; height: 13px; }

  /* 오늘 */
  .hero { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .week { display: flex; gap: 6px; }
  .week .d { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .week .d i { width: 22px; height: 22px; border-radius: 50%; background: var(--surface2); display: block; }
  .week .d.on i { background: var(--accent); }
  .week .d.today span { color: var(--text); }
  .bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .parts { display: grid; gap: 8px; margin-top: 12px; }
  .part-p { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; }
  .part-p .bar { grid-column: 1 / -1; height: 5px; margin: 2px 0 0; }

  /* 패턴 목록 */
  .prow { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); }
  .plist .prow:first-child, .unit .prow:nth-child(2) { border-top: 0; }
  .pno { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; font-weight: 700; width: 30px; flex-shrink: 0; }
  .pt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pt b { font-size: 16px; font-weight: 650; }
  .pt span { color: var(--muted); font-size: 14px; }
  .chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; color: transparent; }
  .chk svg { width: 14px; height: 14px; }
  .prow.done .chk { background: var(--green); border-color: var(--green); color: #fff; }
  .prow .fav { color: var(--amber); width: 16px; height: 16px; flex-shrink: 0; }
  .unit { margin-top: 10px; }
  .uh { font-size: 13px; font-weight: 700; color: var(--accent); padding: 8px 2px 4px; }
  .search input { width: 100%; height: 44px; border-radius: 12px; border: 0; background: var(--surface); padding: 0 14px; font-size: 16px; box-shadow: var(--shadow); outline: none; }
  .seg { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; gap: 3px; margin: 12px 0; }
  .seg button { flex: 1; min-height: 32px; border-radius: 8px; font-size: 14px; font-weight: 650; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* 패턴 상세 */
  .subtop { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  .back { color: var(--accent); font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 2px; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn.on { color: var(--amber); }
  .pmeta { color: var(--muted); font-size: 13px; font-weight: 700; margin-top: 8px; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 6px 0 4px; }
  .pen { font-size: 28px; margin: 0; line-height: 1.25; }
  .pko { color: var(--muted); font-size: 17px; margin: 6px 0 0; }
  .desc { margin: 0; line-height: 1.65; font-size: 15px; }
  .similar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .chip { background: var(--surface2); border-radius: 999px; padding: 5px 11px; font-size: 14px; font-weight: 600; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sec-h .row { gap: 6px; }
  mark { background: none; color: var(--accent); font-weight: 700; }
  .ex { display: flex; gap: 12px; align-items: center; padding: 14px 8px; margin: 0 -8px; border-top: 1px solid var(--line); border-radius: 12px; transition: background .2s; }
  .ex .t { flex: 1; min-width: 0; }
  .ex .ko { color: var(--muted); font-size: 15px; line-height: 1.5; }
  .ex .ko mark { color: var(--text); }
  .ex .note { font-size: 13px; margin-left: 4px; }
  .ex .en { font-size: 18px; line-height: 1.45; font-weight: 520; margin-top: 3px; transition: filter .2s; }
  .hide-en .ex:not(.revealed) .en { filter: blur(7px); }
  .playing { background: var(--accent-soft) !important; }
  .words { margin-top: 6px; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }
  .words b { color: var(--accent); margin-right: 4px; }
  .turn { display: flex; gap: 8px; align-items: flex-end; margin: 12px 0; }
  .turn.right { flex-direction: row-reverse; }
  .spk { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
  .turn.right .spk { background: var(--accent); color: #fff; }
  .bubble { background: var(--surface2); border-radius: 18px; padding: 10px 13px; max-width: 76%; transition: background .2s; }
  .turn.right .bubble { background: var(--accent-soft); }
  .bubble .en { font-size: 16px; line-height: 1.5; }
  .bubble .ko { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .turn .play { align-self: center; }
  .tgt { border: 1.5px dashed var(--accent); border-radius: 8px; padding: 0 5px; color: var(--accent); font-weight: 650; cursor: pointer; }
  .tgt .tgt-en { display: none; }
  .tgt.shown { border-style: solid; }
  .tgt.shown .tgt-ko { display: none; } .tgt.shown .tgt-en { display: inline; }
  .tips p { margin: 10px 0 0; line-height: 1.65; font-size: 15px; }
  .pnav { display: flex; gap: 8px; margin: 18px 0 8px; }
  .pnav .grow { flex: 1; }
  .pnav .btn.done { background: var(--green-soft); color: var(--green); }

  /* 퀴즈 */
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 12px; }
  .field select { height: 44px; border-radius: 12px; border: 0; background: var(--surface2); padding: 0 12px; font-size: 16px; color: var(--text); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .ck { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 12px; padding: 11px 12px; font-size: 14px; font-weight: 600; }
  .ck input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .urow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 2px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .urow:first-of-type { border-top: 0; }
  .urow .best { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .urow .best.full { color: var(--green); }
  .qtop { display: flex; align-items: center; gap: 12px; margin: 6px 0 4px; }
  .qbar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .qbar i { display: block; height: 100%; background: var(--accent); }
  .qnum { font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .qcard { padding: 20px 18px; }
  .qkind { font-size: 13px; color: var(--accent); font-weight: 750; }
  .qko { font-size: 20px; font-weight: 650; line-height: 1.5; margin: 8px 0 16px; }
  .qko mark { color: inherit; }
  .qen { font-size: 19px; line-height: 2.2; }
  input.blank { font-size: 17px; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); border-radius: 7px 7px 0 0; padding: 3px 6px; margin: 0 2px; min-width: 5ch; max-width: 100%; outline: none; }
  input.blank.ok { border-color: var(--green); background: var(--green-soft); }
  input.blank.bad { border-color: var(--red); background: var(--red-soft); }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--surface2); font-size: 16px; line-height: 1.45; border: 2px solid transparent; width: 100%; }
  .opt.correct { border-color: var(--green); background: var(--green-soft); }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); }
  .fb { margin-top: 16px; padding: 14px; border-radius: 14px; display: flex; gap: 12px; align-items: center; }
  .fb.ok { background: var(--green-soft); } .fb.bad { background: var(--red-soft); }
  .fb .t { font-weight: 800; font-size: 15px; }
  .fb.ok .t { color: var(--green); } .fb.bad .t { color: var(--red); }
  .fb .a { font-size: 16px; line-height: 1.5; margin-top: 3px; }
  .fb > div { flex: 1; }
  .ctx { background: var(--surface2); border-radius: 14px; padding: 12px; font-size: 15px; line-height: 1.5; margin: 10px 0; }
  .ctx .ko { color: var(--muted); font-size: 13px; }
  .listen-btn { display: flex; justify-content: center; margin: 10px 0 18px; }
  .result { text-align: center; padding: 26px 16px; }
  .score { font-size: 56px; font-weight: 850; letter-spacing: -.03em; }
  .score small { font-size: 22px; color: var(--muted); }
  .wrong-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .wrong-item .t { flex: 1; } .wrong-item .ko { color: var(--muted); font-size: 14px; } .wrong-item .en { font-size: 16px; margin-top: 2px; }

  /* 복습 */
  .fc { min-height: 320px; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 26px 20px; }
  .fc .pl { font-size: 13px; font-weight: 700; color: var(--muted); }
  .fc .ko { font-size: 22px; font-weight: 650; line-height: 1.5; margin-top: 14px; }
  .fc .ko mark { color: inherit; }
  .fc .en { font-size: 21px; line-height: 1.5; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .fc .play { margin: 16px auto 0; }
  .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grade button { min-height: 54px; border-radius: 14px; font-weight: 750; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .grade button small { font-size: 11px; font-weight: 600; opacity: .75; }
  .g-again { background: var(--red-soft); color: var(--red); }
  .g-hard { background: var(--amber-soft); color: var(--amber); }
  .g-good { background: var(--green-soft); color: var(--green); }
  .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
  .boxes div { background: var(--surface2); border-radius: 12px; padding: 10px 4px; }
  .boxes b { display: block; font-size: 20px; }
  .boxes span { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* 설정 */
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .set-row:first-of-type { border-top: 0; }
  .set-row .seg { margin: 0; min-width: 170px; }
  .set-row select { max-width: 190px; height: 36px; border-radius: 10px; border: 0; background: var(--surface2); padding: 0 8px; font-size: 15px; color: var(--text); }
  .set-row input[type=range] { width: 150px; accent-color: var(--accent); }
  .sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--surface2); position: relative; transition: background .2s; flex-shrink: 0; margin: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .sw:checked { background: var(--green); } .sw:checked::after { transform: translateX(20px); }
  .set-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* 처음 화면 */
  .onboard { text-align: center; padding: 40px 8px; }
  .onboard img { width: 92px; height: 92px; border-radius: 22px; box-shadow: var(--shadow); }
  .onboard p { line-height: 1.65; color: var(--muted); }
  .steps { text-align: left; margin: 20px 0; display: grid; gap: 10px; }
  .steps div { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5; }
  .steps b { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }

  /* 탭바 · 플레이어 · 토스트 */
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--line); display: flex; z-index: 20; }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #tabs { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  }
  #tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 650; color: var(--muted); position: relative; }
  #tabs a.on { color: var(--accent); }
  #tabs svg { width: 24px; height: 24px; }
  #tabs .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; min-width: 17px; height: 17px; padding: 0 4px; display: grid; place-items: center; }
  #tabs .badge[hidden] { display: none; }
  .no-tabs #tabs { display: none; }
  #player { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 10px); max-width: 616px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 15px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; z-index: 30; box-shadow: 0 8px 26px rgba(0,0,0,.25); }
  #player[hidden] { display: none; }
  #playerText { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player button { height: 36px; padding: 0 14px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 18%, transparent); font-weight: 700; font-size: 14px; }
  /* 원어민 MP3 */
  .mp3-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .mp3-btns .btn { flex-direction: column; gap: 2px; min-height: 64px; white-space: normal; }
  .mp3-btns .btn small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .mp3-btns .btn.on small { color: var(--accent); }
  #mp3bar { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 10px); max-width: 616px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 26px rgba(0,0,0,.16); padding: 10px 12px 8px; z-index: 29; display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 10px; align-items: center; }
  #mp3bar[hidden] { display: none; }
  .mp3-play { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .mp3-play svg { width: 16px; height: 16px; }
  .mp3-info { min-width: 0; }
  .mp3-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp3-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mp3-sm { font-size: 13px; font-weight: 700; padding: 7px 9px; border-radius: 9px; background: var(--surface2); min-width: 44px; }
  #mp3seek { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; height: 18px; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>

<div id="player" hidden><div id="playerText"></div><button id="playerStop">정지</button></div>
<div id="toast"></div>

<audio id="mp3" preload="none" playsinline></audio>
<div id="mp3bar" hidden>
  <button class="mp3-play" id="mp3Toggle" aria-label="재생/일시정지"></button>
  <div class="mp3-info"><div class="mp3-title" id="mp3Title"></div><div class="mp3-time" id="mp3Time">0:00</div></div>
  <button class="mp3-sm" id="mp3Rate" aria-label="재생 속도">1.0×</button>
  <button class="mp3-sm" id="mp3Close" aria-label="닫기">닫기</button>
  <input type="range" id="mp3seek" min="0" max="1000" value="0" aria-label="재생 위치">
</div>

<nav id="tabs">
  <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</a>
  <a href="#/list" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>패턴</a>
  <a href="#/review" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>복습<span class="badge" id="dueBadge" hidden></span></a>
  <a href="#/quiz" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>테스트</a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>설정</a>
</nav>

<script>
(() => {
'use strict';
// ================= 기본 도구 =================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad3 = (n) => String(n).padStart(3, '0');
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const app = $('#app');

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.4-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
};

const LS = {
  get(k, d) { try { const v = localStorage.getItem('ep500.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ep500.' + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem('ep500.' + k); } catch {} },
};

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900); }

// ================= 날짜 =================
const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const today = () => ymd();
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

// ================= 데이터 · 학습 기록 =================
let BOOK = LS.get('book', null);
let IDX = null;
const defaultSettings = () => ({ perDay: 2, rate: 0.9, voiceA: '', voiceB: '', readKo: true, repeat: 1, autoplay: true, hideEn: false,
  quiz: { range: 'learned', count: 10, types: { fill: true, choice: true, listen: true, speak: false } } });
let P = Object.assign({ done: {}, fav: {}, cards: {}, wrong: {}, days: {}, tests: {}, daily: null }, LS.get('prog', {}));
P.settings = Object.assign(defaultSettings(), P.settings || {});
const save = () => { if (!LS.set('prog', P)) toast('저장 공간이 부족합니다'); };

function indexBook() {
  IDX = {
    pats: new Map(BOOK.patterns.map((p) => [p.no, p])),
    units: new Map(BOOK.units.map((u) => [u.no, u])),
    tests: new Map(BOOK.tests.map((t) => [t.unit, t])),
  };
}
function validBook(d) { return d && Array.isArray(d.patterns) && d.patterns.length >= 100 && Array.isArray(d.units) && Array.isArray(d.parts); }

const segText = (segs) => segs.map((s) => s[0]).join('').replace(/\s+/g, ' ').trim();
const segHTML = (segs) => segs.map(([t, h]) => (h ? `<mark>${esc(t)}</mark>` : esc(t))).join('');
const hlParts = (segs) => segs.filter((s) => s[1]).map((s) => s[0].trim()).filter(Boolean);

function markDay() { P.days[today()] = true; save(); }
function streak() { let n = 0, d = today(); if (!P.days[d]) d = addDays(d, -1); while (P.days[d]) { n++; d = addDays(d, -1); } return n; }

function todayList() {
  const t = today(), per = P.settings.perDay;
  if (!P.daily || P.daily.date !== t || P.daily.per !== per) {
    const keep = P.daily && P.daily.date === t ? P.daily.list.filter((n) => P.done[n] === t) : [];
    const list = [...keep];
    for (const p of BOOK.patterns) { if (list.length >= Math.max(per, keep.length)) break; if (!P.done[p.no] && !list.includes(p.no)) list.push(p.no); }
    P.daily = { date: t, per, list };
    save();
  }
  return P.daily.list;
}
const firstUndone = () => BOOK.patterns.find((p) => !P.done[p.no])?.no;

// 카드 id: "패턴.예문번호" 또는 "패턴.d대화차례"
function itemOf(id) {
  const [no, k] = String(id).split('.');
  const p = IDX.pats.get(+no); if (!p || k == null) return null;
  if (k[0] === 'd') { const l = p.dialog[+k.slice(1)]; return l && l.tEn ? { id, kind: 'd', p, l, j: +k.slice(1) } : null; }
  const e = p.examples[+k]; return e ? { id, kind: 'e', p, e, i: +k } : null;
}
function idsOfPattern(no) {
  const p = IDX.pats.get(no);
  return [...p.examples.map((_, i) => `${no}.${i}`), ...p.dialog.map((l, j) => (l.tEn ? `${no}.d${j}` : null)).filter(Boolean)];
}
const INTERVALS = [1, 2, 4, 7, 15, 30, 60];
function toggleDone(no) {
  const t = today();
  if (P.done[no]) { delete P.done[no]; save(); return false; }
  P.done[no] = t;
  for (const id of idsOfPattern(no)) if (!P.cards[id]) P.cards[id] = { box: 0, due: addDays(t, 1) };
  markDay();
  return true;
}
const dueIds = () => Object.entries(P.cards).filter(([id, c]) => c.due <= today() && itemOf(id)).map(([id]) => id);

// ================= 음성 (TTS) =================
const TTS = (() => {
  const synth = window.speechSynthesis;
  let voices = [], listeners = [], token = 0;
  const load = () => { voices = synth ? synth.getVoices() : []; listeners.forEach((f) => f()); };
  // iOS 홈 화면 앱은 목록이 처음엔 비어 있다가 늦게(또는 첫 발화 뒤에) 채워지므로 여러 번 다시 읽는다
  const loadIfChanged = () => { const n = voices.length; voices = synth ? synth.getVoices() : []; if (voices.length !== n) listeners.forEach((f) => f()); };
  if (synth) {
    load(); if ('onvoiceschanged' in synth) synth.onvoiceschanged = load;
    let tries = 0; const poll = setInterval(() => { loadIfChanged(); if (voices.length || ++tries > 20) clearInterval(poll); }, 500);
  }
  const en = () => voices.filter((v) => /^en[-_]/i.test(v.lang));
  const ranked = () => {
    const all = en(), us = all.filter((v) => /en[-_]US/i.test(v.lang));
    const nice = us.filter((v) => /premium|enhanced|samantha|ava|allison|evan|zoe|joelle|nathan|aaron|nicky|google us/i.test(v.name));
    return [...new Set([...nice, ...us, ...all])];
  };
  const ko = () => voices.find((v) => /^ko/i.test(v.lang)) || null;
  // '__system' = 목소리를 지정하지 않고 iOS 설정(손쉬운 사용 → 읽기 및 말하기)의 기본 음성에 맡김
  function voice(name, k) { if (name === '__system') return null; return en().find((v) => v.name === name) || ranked()[k] || ranked()[0] || null; }
  const refresh = () => loadIfChanged();
  function one(text, voiceObj, lang, rate) {
    return new Promise((res) => {
      if (!synth) return res();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = voiceObj?.lang || lang; if (voiceObj) u.voice = voiceObj; u.rate = rate;
      let fin = false; const done = () => { if (!fin) { fin = true; clearTimeout(tm); if (synth) loadIfChanged(); res(); } };
      u.onend = done; u.onerror = done;
      const tm = setTimeout(done, 3000 + (text.length * 110) / rate);
      synth.speak(u);
    });
  }
  async function play(items, onItem) {
    stop(); const my = ++token;
    if (synth && synth.paused) synth.resume();
    for (let i = 0; i < items.length; i++) {
      if (my !== token) return false;
      const it = items[i]; onItem?.(it);
      await one(it.text, it.voice, it.lang || 'en-US', it.rate || P.settings.rate);
      if (my !== token) return false;
      await sleep(it.pause ?? 250);
    }
    if (my === token) onItem?.(null);
    return my === token;
  }
  function stop() { token++; if (synth) synth.cancel(); }
  return { play, stop, en, ranked, ko, voice, refresh, onChange: (f) => listeners.push(f), get ok() { return !!synth; } };
})();

const voiceA = () => TTS.voice(P.settings.voiceA, 0);
const voiceB = () => {
  const a = voiceA(), b = TTS.voice(P.settings.voiceB, 1);
  if (!P.settings.voiceB && a && b && a.name === b.name) return TTS.ranked().find((v) => v.name !== a.name) || b;
  return b;
};
const voiceSelValue = (key) => (P.settings[key] === '__system' ? '__system' : (key === 'voiceA' ? voiceA() : voiceB())?.name || '');
const enItem = (text, el, who = 'A', extra = {}) => ({ text, el, voice: who === 'B' ? voiceB() : voiceA(), lang: 'en-US', ...extra });
const koItem = (text, el, extra = {}) => ({ text, el, voice: TTS.ko(), lang: 'ko-KR', rate: Math.min(1.1, P.settings.rate + 0.1), ...extra });

let playingToken = 0;
async function playItems(items) {
  if (!TTS.ok) return toast('이 브라우저는 음성 읽기를 지원하지 않습니다');
  MP3.pause();
  const my = ++playingToken;
  const clear = () => $$('.playing').forEach((e) => e.classList.remove('playing'));
  clear();
  if (items.length > 1) { $('#player').hidden = false; }
  const finished = await TTS.play(items, (it) => {
    clear();
    if (!it) return;
    it.el?.classList.add('playing');
    $('#playerText').textContent = it.text;
    if (items.length > 1) it.el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  if (finished && my === playingToken) { clear(); $('#player').hidden = true; }
}
function stopAudio() { playingToken++; TTS.stop(); $$('.playing').forEach((e) => e.classList.remove('playing')); $('#player').hidden = true; }
$('#playerStop').onclick = stopAudio;
const say = (text, who = 'A') => playItems([enItem(text, null, who)]);

// ================= 원어민 MP3 (출판사 QR 자료를 그 서버에서 바로 재생) =================
const MP3 = (() => {
  const URL_OF = (k, n) => `https://nexusbook.com/vod/qr/5061/${k}/${n}.mp3`;
  const NAME = { li: '듣기 MP3', ex: '훈련 MP3' };
  const RATES = [0.8, 0.9, 1, 1.1, 1.25];
  const a = $('#mp3'), bar = $('#mp3bar'), seek = $('#mp3seek');
  let Q = null, seeking = false;
  const fmt = (s) => (isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00');
  const cur = () => (Q ? Q.list[Q.i] : null);
  const title = (t) => `Pattern ${pad3(t.n)} ${NAME[t.k]}`;
  function ui() {
    const t = cur(); if (!t) { bar.hidden = true; return; }
    bar.hidden = false; $('#player').hidden = true;
    $('#mp3Title').textContent = title(t) + (Q.list.length > 1 ? ` (${Q.i + 1}/${Q.list.length})` : '');
    $('#mp3Toggle').innerHTML = a.paused ? ICON.play : ICON.pause;
    const r = P.settings.mp3Rate || 1;
    $('#mp3Rate').textContent = `${r === 1 ? '1.0' : r}×`;
    $$('[data-act="mp3"]').forEach((b) => b.classList.toggle('on', +b.dataset.n === t.n && b.dataset.k === t.k));
  }
  function load() {
    const t = cur();
    a.src = URL_OF(t.k, t.n); a.playbackRate = P.settings.mp3Rate || 1;
    a.play().catch(() => toast('MP3를 재생할 수 없습니다. 인터넷 연결을 확인하세요'));
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: title(t), artist: IDX?.pats.get(t.n)?.en || '', album: '영어패턴 매일 학습', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
    }
    ui();
  }
  function play(list, i = 0) { stopAudio(); Q = { list, i }; load(); }
  function step(d) { if (!Q) return; const j = Q.i + d; if (j < 0 || j >= Q.list.length) return; Q.i = j; load(); }
  function close() { a.pause(); a.removeAttribute('src'); a.load(); Q = null; ui(); }
  a.addEventListener('loadedmetadata', () => { a.playbackRate = P.settings.mp3Rate || 1; });
  a.addEventListener('play', ui); a.addEventListener('pause', ui);
  a.addEventListener('timeupdate', () => { if (!seeking && a.duration) seek.value = Math.round((a.currentTime / a.duration) * 1000); $('#mp3Time').textContent = `${fmt(a.currentTime)} / ${fmt(a.duration)}`; });
  a.addEventListener('ended', () => { if (Q && Q.i < Q.list.length - 1) step(1); else ui(); });
  a.addEventListener('error', () => { if (Q) toast('MP3를 불러오지 못했습니다'); });
  seek.addEventListener('input', () => { seeking = true; if (a.duration) $('#mp3Time').textContent = `${fmt((seek.value / 1000) * a.duration)} / ${fmt(a.duration)}`; });
  seek.addEventListener('change', () => { if (a.duration) a.currentTime = (seek.value / 1000) * a.duration; seeking = false; });
  $('#mp3Toggle').onclick = () => { if (a.paused) { stopAudio(); a.play().catch(() => {}); } else a.pause(); };
  $('#mp3Close').onclick = close;
  $('#mp3Rate').onclick = () => { const r = P.settings.mp3Rate || 1; P.settings.mp3Rate = RATES[(RATES.indexOf(r) + 1) % RATES.length] ?? 1; a.playbackRate = P.settings.mp3Rate; save(); ui(); };
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', () => a.play());
    ms.setActionHandler('pause', () => a.pause());
    ms.setActionHandler('previoustrack', () => step(-1));
    ms.setActionHandler('nexttrack', () => step(1));
  }
  return { play, pause: () => { if (!a.paused) a.pause(); }, ui };
})();

// ================= 화면 전환 =================
let skipNextRoute = false;
function go(hash) { if (location.hash === hash) { route(); return; } skipNextRoute = true; location.hash = hash; route(); }
window.addEventListener('hashchange', () => { if (skipNextRoute) { skipNextRoute = false; return; } route(); });

function route() {
  stopAudio();
  const h = location.hash || '#/';
  document.body.classList.toggle('no-tabs', !BOOK);
  if (!BOOK) return viewImport();
  let m;
  if (h === '#/' || h === '#') viewToday();
  else if (h === '#/list') viewList();
  else if ((m = h.match(/^#\/p\/(\d+)$/))) viewPattern(+m[1]);
  else if (h === '#/quiz') viewQuizHome();
  else if (h === '#/quiz/run') viewQuizRun();
  else if (h === '#/review') viewReview();
  else if (h === '#/settings') viewSettings();
  else { location.replace('#/'); return; }
  const tab = h.startsWith('#/p/') ? 'list' : h.startsWith('#/quiz') ? 'quiz' : (h.slice(2) || 'today');
  $$('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
  updateBadge(); MP3.ui();
  if (!h.startsWith('#/quiz/run') && !(h === '#/review' && RV)) window.scrollTo(0, 0);
}
function updateBadge() { if (!BOOK) return; const n = dueIds().length, b = $('#dueBadge'); b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }

// 공통 클릭 처리
const ACT = {};
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !app.contains(el)) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});

// ================= 처음: 데이터 불러오기 =================
function viewImport() {
  app.innerHTML = `
    <div class="onboard">
      <img src="icon-180.png" alt="">
      <h1 style="margin-top:18px">영어패턴 매일 학습</h1>
      <p>처음 한 번만 책 데이터 파일을 불러오면 됩니다.<br>데이터는 이 기기 안에만 저장돼요.</p>
      <div class="steps">
        <div><b>1</b><span>컴퓨터에서 받은 <strong>영어패턴500_데이터.json</strong> 파일을 아이폰 '파일' 앱에 저장해 두세요. (카카오톡 나에게 보내기 → 저장, 또는 iCloud Drive)</span></div>
        <div><b>2</b><span>아래 버튼을 눌러 그 파일을 고르세요.</span></div>
        <div><b>3</b><span>홈 화면 앱으로 쓰려면, 먼저 Safari 공유 버튼 → '홈 화면에 추가'로 설치한 뒤 그 앱 안에서 불러오세요.</span></div>
      </div>
      <label class="btn primary block">데이터 파일 선택<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    </div>`;
  $('#importFile').onchange = (e) => importFile(e.target.files[0]);
}
async function importFile(f) {
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!validBook(d)) throw new Error('형식');
    if (!LS.set('book', d)) return toast('저장 공간이 부족해 불러오지 못했습니다');
    BOOK = d; indexBook(); toast(`패턴 ${d.patterns.length}개를 불러왔습니다`);
    go('#/');
  } catch { toast('올바른 데이터 파일이 아닙니다'); }
}

// ================= 오늘 =================
function patRow(n) {
  const p = IDX.pats.get(n), done = !!P.done[n];
  return `<a class="prow ${done ? 'done' : ''}" href="#/p/${n}"><span class="pno">${pad3(n)}</span><span class="pt"><b>${esc(p.en)}</b><span>${esc(p.ko)}</span></span>${P.fav[n] ? `<span class="fav">${ICON.starOn}</span>` : ''}<span class="chk">${ICON.check}</span></a>`;
}
function viewToday() {
  const list = todayList(), doneN = Object.keys(P.done).length, due = dueIds().length, s = streak();
  const d = new Date(), t = today();
  const week = [...Array(7)].map((_, i) => { const day = addDays(t, i - 6); const dd = new Date(day); return `<div class="d ${P.days[day] ? 'on' : ''} ${i === 6 ? 'today' : ''}"><i></i><span>${DOW[dd.getDay()]}</span></div>`; }).join('');
  const todayDone = list.filter((n) => P.done[n]).length;
  const next = list.find((n) => !P.done[n]) ?? firstUndone();
  const allTodayDone = list.length && todayDone === list.length;
  app.innerHTML = `
    <header class="top"><div class="date">${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</div><h1>오늘의 영어</h1></header>
    <section class="card hero">
      <div><div class="label">연속 학습</div><div class="big">${s}<small>일</small></div></div>
      <div class="week">${week}</div>

const norm = (s) => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
function variants(a) {
  const m1 = a.match(/\(([^)]*)\)/);
  if (m1) return [...variants(a.replace(m1[0], m1[1])), ...variants(a.replace(m1[0], ' '))];
  const m2 = a.match(/(\S+)\/(\S+)/);
  if (m2) return [...variants(a.replace(m2[0], m2[1])), ...variants(a.replace(m2[0], m2[2]))];
  return [a];
}
const matches = (given, answer) => variants(answer).some((v) => norm(v) === norm(given));

function relatedPats(p) {
  const unit = IDX.units.get(p.unit).patterns.filter((n) => n !== p.no);
  const near = [];
  for (let d = 1; d <= 12; d++) { if (p.no - d >= 1) near.push(p.no - d); if (p.no + d <= BOOK.patterns.length) near.push(p.no + d); }
  return [...new Set([...shuffle(unit), ...shuffle(near)])].map((n) => IDX.pats.get(n)).filter(Boolean);
}
function enOptions(p, e) {
  const correct = segText(e.en), hl = e.en.filter((s) => s[1]).length, out = new Set();
  for (const q of relatedPats(p)) {
    if (out.size >= 3) break;
    if (hl) {
      const ex = shuffle([...q.examples]).find((x) => x.en.some((s) => s[1])); if (!ex) continue;
      const parts = ex.en.filter((s) => s[1]).map((s) => s[0]);
      let k = 0;
      const t = e.en.map((s) => (s[1] ? parts[Math.min(k++, parts.length - 1)] : s[0])).join('').replace(/\s+/g, ' ').trim();
      if (norm(t) !== norm(correct)) out.add(t);
    } else {
      const t = segText(pick(q.examples).en); if (t !== correct) out.add(t);
    }
  }
  return shuffle([correct, ...[...out].slice(0, 3)]);
}
function koOptions(p, e) {
  const correct = segText(e.ko), out = new Set();
  for (const q of relatedPats(p)) { if (out.size >= 3) break; const t = segText(pick(q.examples).ko); if (t !== correct) out.add(t); }
  return shuffle([correct, ...out]);
}
function makeQ(id, types) {
  const x = itemOf(id); if (!x) return null;
  if (x.kind === 'd') {
    if (!types.speak) return null;
    const prev = x.j > 0 ? x.p.dialog[x.j - 1] : null;
    return { kind: 'speak', id, p: x.p, prev, l: x.l };
  }
  const kinds = [];
  if (types.fill && x.e.en.some((s) => s[1])) kinds.push('fill', 'fill');
  if (types.choice) kinds.push('choice');
  if (types.listen) kinds.push('listen');
  if (!kinds.length) return null;
  const kind = pick(kinds);
  if (kind === 'fill') return { kind, id, p: x.p, e: x.e, answers: hlParts(x.e.en) };
  if (kind === 'choice') { const opts = enOptions(x.p, x.e); return { kind, id, p: x.p, e: x.e, opts, correct: opts.indexOf(segText(x.e.en)) }; }
  const opts = koOptions(x.p, x.e);
  return { kind: 'listen', id, p: x.p, e: x.e, opts, correct: opts.indexOf(segText(x.e.ko)) };
}
function idsForRange(range) {
  if (range === 'wrong') return Object.keys(P.wrong).filter(itemOf);
  let nos = [];
  if (range === 'learned') nos = Object.keys(P.done).map(Number);
  else if (range === 'today') nos = todayList();
  else if (range === 'fav') nos = Object.keys(P.fav).map(Number);
  else if (range.startsWith('unit:')) nos = IDX.units.get(+range.slice(5))?.patterns || [];
  return nos.flatMap(idsOfPattern);
}
function buildQuiz(range, count, types) {
  const ids = shuffle(idsForRange(range));
  const qs = [];
  for (const id of ids) { if (qs.length >= count) break; const q = makeQ(id, types); if (q) qs.push(q); }
  return qs;
}

    body = `<div class="qko">${segHTML(q.e.ko)}</div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q.kind === 'listen') {
    body = `<div class="listen-btn"><button class="play lg" data-act="qListen" aria-label="다시 듣기">${ICON.play}</button></div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q.kind === 'speak') {
    body = `${q.prev ? `<div class="ctx"><div><b>${esc(q.prev.s)}</b> ${esc(q.prev.en)}</div><div class="ko">${esc(q.prev.ko)}</div></div>` : ''}
      <div class="qko"><span class="muted">${esc(q.l.s)}</span> ${esc(q.l.tKo)}</div>
      <p class="hint" style="margin-top:-6px">소리 내어 영어로 말해 본 뒤 정답을 확인하세요.</p>
      <div id="speakArea"><button class="btn primary block" data-act="speakReveal">정답 보기</button></div>`;
  }
  app.innerHTML = `
    <div class="qtop"><a class="back" href="#/quiz" data-act="quitQuiz">‹ 그만</a><div class="qbar"><i style="width:${(QZ.i / n) * 100}%"></i></div><span class="qnum">${QZ.i + 1}/${n}</span></div>
    <section class="card qcard"><div class="qkind">${esc(QZ.title)} · ${KIND_LABEL[q.kind]}</div>${body}<div id="fb"></div></section>`;
  QZ.answered = false;
  const first = $('input.blank');
  if (first) {
    $$('input.blank').forEach((inp, i, all) => inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return; e.preventDefault();
      if (QZ.answered) return ACT.next();
      if (i < all.length - 1 && !all[i + 1].value) all[i + 1].focus(); else ACT.check();
    }));
    setTimeout(() => first.focus(), 60);
  }
  if (q.kind === 'listen') ACT.qListen();
}
function answerSentence(q) {
  if (q.kind === 'book') { let k = 0; return q.q.q.map((t) => (t === null ? q.q.a[k++] : t)).join('').replace(/\s+/g, ' ').trim(); }
  if (q.kind === 'speak') return q.l.tEn;
  return segText(q.e.en);
}
function feedback(ok, q, extra = '') {
  QZ.answered = true;
  QZ.results.push({ q, ok });
  const sentence = answerSentence(q);
  $('#fb').innerHTML = `
    <div class="fb ${ok ? 'ok' : 'bad'}"><div><div class="t">${ok ? '정답' : '오답'}</div><div class="a">${esc(sentence)}</div>${q.kind === 'listen' || q.kind === 'choice' ? `<div class="sm muted" style="margin-top:3px">${esc(segText(q.e.ko))}</div>` : ''}</div><button class="play" data-act="fbPlay" aria-label="듣기">${ICON.play}</button></div>
    ${extra}
    <button class="btn primary block" data-act="next">${QZ.i + 1 < QZ.qs.length ? '다음' : '결과 보기'}</button>`;
  if (P.settings.autoplay && q.kind !== 'listen') say(sentence);
  $('#fb').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
ACT.check = () => {
  if (QZ.answered) return;
  const q = QZ.qs[QZ.i], inputs = $$('input.blank');
  const answers = q.kind === 'book' ? q.q.a : q.answers;
  let all = true;
  inputs.forEach((inp, k) => { const ok = matches(inp.value, answers[k] || ''); inp.classList.add(ok ? 'ok' : 'bad'); if (!ok) all = false; inp.readOnly = true; });
  inputs.forEach((i) => i.blur());
  $('[data-act="check"]')?.remove();
  feedback(all, q, all ? '' : '<button class="btn sm block" data-act="override" style="margin-top:8px">맞게 썼어요 (정답으로 처리)</button>');
};
ACT.override = (el) => { const r = QZ.results[QZ.results.length - 1]; r.ok = true; el.remove(); const fb = $('.fb'); fb.classList.replace('bad', 'ok'); fb.querySelector('.t').textContent = '정답'; };
ACT.opt = (el) => {
  if (QZ.answered) return;
  const q = QZ.qs[QZ.i], i = +el.dataset.i, ok = i === q.correct;
  $$('.opt').forEach((b, k) => { if (k === q.correct) b.classList.add('correct'); else if (k === i) b.classList.add('wrong'); });
  feedback(ok, q);
};
ACT.qListen = () => { const q = QZ.qs[QZ.i]; say(segText(q.e.en)); };
ACT.fbPlay = () => say(answerSentence(QZ.qs[QZ.i]));
ACT.speakReveal = () => {
  const q = QZ.qs[QZ.i];
  $('#speakArea').innerHTML = `<div class="fb ok" style="background:var(--surface2)"><div><div class="a" style="font-size:18px">${esc(q.l.tEn)}</div></div><button class="play" data-act="fbPlay" aria-label="듣기">${ICON.play}</button></div>
    <div class="grade" style="grid-template-columns:1fr 1fr;margin-top:12px"><button class="g-again" data-act="speakGrade" data-ok="0">틀렸어요</button><button class="g-good" data-act="speakGrade" data-ok="1">맞혔어요</button></div>`;
  say(q.l.tEn, q.l.s === 'B' ? 'B' : 'A');
};
ACT.speakGrade = (el) => {
  const q = QZ.qs[QZ.i]; QZ.answered = true; QZ.results.push({ q, ok: el.dataset.ok === '1' });
  QZ.i++; stopAudio(); viewQuizRun(); window.scrollTo(0, 0);
};
ACT.next = () => { if (!QZ.answered) return; QZ.i++; stopAudio(); viewQuizRun(); window.scrollTo(0, 0); };
ACT.quitQuiz = () => { if (QZ && QZ.results.length && QZ.i < QZ.qs.length && !confirm('테스트를 그만할까요?')) return; QZ = null; go('#/quiz'); };

function viewQuizResult() {
  const R = QZ.results, ok = R.filter((r) => r.ok).length, n = R.length;
  if (!QZ.saved) {
    QZ.saved = true;
    for (const r of R) { const id = r.q.id; if (!id) continue; if (r.ok) delete P.wrong[id]; else P.wrong[id] = (P.wrong[id] || 0) + 1; }
    if (QZ.meta.unit) P.tests[QZ.meta.unit] = Math.max(P.tests[QZ.meta.unit] ?? 0, ok);
    markDay();
  }
  const wrong = R.filter((r) => !r.ok);
  const msg = n && ok === n ? '완벽해요!' : ok / n >= 0.8 ? '잘했어요!' : ok / n >= 0.5 ? '조금만 더!' : '복습하고 다시 도전해요';
  app.innerHTML = `
    <section class="card result"><div class="label">${esc(QZ.title)}</div><div class="score">${ok}<small>/${n}</small></div><div style="font-weight:700;font-size:18px">${msg}</div></section>
    ${wrong.length ? `<section class="card"><h2>틀린 문제</h2>${wrong.map((r, i) => {
      const ko = r.q.kind === 'book' ? r.q.q.ko : r.q.kind === 'speak' ? r.q.l.tKo : segText(r.q.e.ko);
      return `<div class="wrong-item"><div class="t"><div class="ko">${esc(ko)}</div><div class="en">${esc(answerSentence(r.q))}</div></div><button class="play sm" data-act="resPlay" data-i="${i}" aria-label="듣기">${ICON.play}</button></div>`;
    }).join('')}</section>` : ''}
    <div class="pnav">${wrong.length ? '<button class="btn primary grow" data-act="retryWrong">틀린 것만 다시</button>' : ''}<a class="btn grow" href="#/quiz">테스트 홈</a></div>`;
  QZ.wrongList = wrong;
}
ACT.resPlay = (el) => say(answerSentence(QZ.wrongList[+el.dataset.i].q));
ACT.retryWrong = () => {
  const qs = QZ.wrongList.map((r) => (r.q.id ? makeQ(r.q.id, { fill: true, choice: true, listen: true, speak: true }) || r.q : r.q));
  startQuiz(shuffle(qs), QZ.title + ' · 다시', QZ.meta.unit ? {} : QZ.meta);
};

// ================= 복습 (간격 반복) =================
let RV = null;
function viewReview() {
  if (RV && RV.i < RV.queue.length) return reviewCard();
  if (RV && RV.i >= RV.queue.length) {
    const r = RV; RV = null; markDay(); updateBadge();
    app.innerHTML = `<section class="card result"><div class="label">복습 완료</div><div class="score">${r.total}<small>문장</small></div>
      <div class="boxes"><div><b>${r.n.good}</b><span>알았음</span></div><div><b>${r.n.hard}</b><span>헷갈림</span></div><div><b>${r.n.again}</b><span>몰랐음</span></div></div></section>
      <a class="btn block" href="#/">오늘 화면으로</a>`;
    return;
  }
  const due = dueIds(), cards = Object.values(P.cards);
  const learning = cards.filter((c) => c.box <= 1).length, mid = cards.filter((c) => c.box >= 2 && c.box <= 4).length, strong = cards.filter((c) => c.box >= 5).length;
  const wrongN = Object.keys(P.wrong).filter(itemOf).length;
  app.innerHTML = `
    <header class="top"><h1>복습</h1></header>
    <section class="card">
      <div class="label">오늘 복습할 문장</div><div class="big">${due.length}<small>문장</small></div>
      <p class="hint">학습 완료한 패턴의 예문이 1·2·4·7·15·30일 간격으로 다시 나와요. 한국어를 보고 영어로 말해 보세요.</p>
      <button class="btn primary block" data-act="startReview" ${due.length ? '' : 'disabled'}>${due.length ? `복습 시작 (${Math.min(due.length, 30)}문장)` : '오늘은 복습할 문장이 없어요'}</button>
      ${!due.length && cards.length ? '<button class="btn block" data-act="extraReview">미리 복습하기 (랜덤 20문장)</button>' : ''}
    </section>
    <section class="card">
      <h2>내 문장 카드 ${cards.length}장</h2>
      <div class="boxes"><div><b>${learning}</b><span>익히는 중</span></div><div><b>${mid}</b><span>익숙함</span></div><div><b>${strong}</b><span>완전히 앎</span></div></div>
    </section>
    <section class="card">
      <div class="row between"><h2>오답 노트</h2><span class="muted sm">${wrongN}문장</span></div>
      <p class="hint">테스트에서 틀린 문장이 모이고, 다시 맞히면 빠집니다.</p>
      <button class="btn block" data-act="wrongQuiz" ${wrongN ? '' : 'disabled'}>오답만 테스트</button>
    </section>`;
}
function beginReview(ids) { RV = { queue: ids, i: 0, shown: false, total: ids.length, n: { again: 0, hard: 0, good: 0 }, requeued: {} }; reviewCard(); window.scrollTo(0, 0); }
ACT.startReview = () => beginReview(shuffle(dueIds()).slice(0, 30));
ACT.extraReview = () => beginReview(shuffle(Object.keys(P.cards).filter(itemOf)).slice(0, 20));
ACT.wrongQuiz = () => { const qs = buildQuiz('wrong', 30, { fill: true, choice: true, listen: true, speak: true }); if (!qs.length) return toast('오답 노트가 비어 있어요'); startQuiz(qs, '오답 노트', { range: 'wrong' }); };
function reviewCard() {
  const id = RV.queue[RV.i], x = itemOf(id);
  if (!x) { RV.i++; return viewReview(); }
  const ko = x.kind === 'e' ? segHTML(x.e.ko) : esc(x.l.tKo);
  const en = x.kind === 'e' ? segHTML(x.e.en) : esc(x.l.tEn);
  const ctx = x.kind === 'd' && x.j > 0 ? `<div class="ctx" style="text-align:left;margin-top:14px"><b>${esc(x.p.dialog[x.j - 1].s)}</b> ${esc(x.p.dialog[x.j - 1].en)}</div>` : '';
  app.innerHTML = `
    <div class="qtop"><a class="back" href="#/review" data-act="quitReview">‹ 그만</a><div class="qbar"><i style="width:${(RV.i / RV.queue.length) * 100}%"></i></div><span class="qnum">${RV.i + 1}/${RV.queue.length}</span></div>
    <section class="card fc" data-act="${RV.shown ? '' : 'rvShow'}">
      <div class="pl">PATTERN ${pad3(x.p.no)} · ${esc(x.p.en)}</div>
      ${ctx}
      <div class="ko">${x.kind === 'd' ? `<span class="muted">${esc(x.l.s)}</span> ` : ''}${ko}</div>
      ${RV.shown ? `<div class="en">${en}</div><button class="play" data-act="rvPlay" aria-label="듣기">${ICON.play}</button>` : '<p class="hint" style="margin-top:24px">영어로 말해 본 뒤 탭하세요</p>'}
    </section>
    ${RV.shown ? `<div class="grade"><button class="g-again" data-act="rvGrade" data-g="again">몰랐음<small>다시 나옴</small></button><button class="g-hard" data-act="rvGrade" data-g="hard">헷갈림<small>내일</small></button><button class="g-good" data-act="rvGrade" data-g="good">알았음<small>${INTERVALS[Math.min((P.cards[id]?.box ?? 0) + 1, INTERVALS.length - 1)]}일 뒤</small></button></div>`
      : '<button class="btn primary block" data-act="rvShow">정답 보기</button>'}`;
}
const rvSentence = () => { const x = itemOf(RV.queue[RV.i]); return x.kind === 'e' ? { t: segText(x.e.en), who: 'A' } : { t: x.l.tEn, who: x.l.s === 'B' ? 'B' : 'A' }; };
ACT.rvShow = () => { if (!RV || RV.shown) return; RV.shown = true; reviewCard(); if (P.settings.autoplay) { const s = rvSentence(); say(s.t, s.who); } };
ACT.rvPlay = () => { const s = rvSentence(); say(s.t, s.who); };
ACT.rvGrade = (el) => {
  const id = RV.queue[RV.i], g = el.dataset.g, t = today();
  const c = P.cards[id] || (P.cards[id] = { box: 0, due: t });
  if (g === 'again') { c.box = 0; c.due = addDays(t, 1); if ((RV.requeued[id] || 0) < 2) { RV.queue.push(id); RV.requeued[id] = (RV.requeued[id] || 0) + 1; } }
  else if (g === 'hard') { c.box = Math.max(0, c.box - 1); c.due = addDays(t, 1); }
  else { c.box = Math.min(c.box + 1, INTERVALS.length - 1); c.due = addDays(t, INTERVALS[c.box]); }
  if (!RV.requeued[id] || g !== 'again') RV.n[g]++;
  save(); stopAudio(); RV.i++; RV.shown = false; viewReview(); window.scrollTo(0, 0);
};
ACT.quitReview = () => { RV = null; stopAudio(); go('#/review'); };

// ================= 설정 =================
function viewSettings() {
  const s = P.settings, voices = TTS.ranked();
  const vOpts = (key) => {
    const cur = voiceSelValue(key);
    return `<option value="__system" ${cur === '__system' ? 'selected' : ''}>아이폰 기본 목소리</option>`
      + voices.map((v) => `<option value="${esc(v.name)}" ${cur === v.name ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  };
  const cardsN = Object.keys(P.cards).length;
  app.innerHTML = `
    <header class="top"><h1>설정</h1></header>
    <section class="card">
      <h2>학습</h2>
      <div class="set-row" style="border-top:0"><span>하루 패턴 수</span><div class="seg">${[1, 2, 3, 4, 5].map((n) => `<button data-act="setPer" data-n="${n}" class="${s.perDay === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="set-row"><div><div>정답 자동으로 읽기</div><div class="set-sub">테스트·복습에서 정답을 보여줄 때</div></div><input type="checkbox" class="sw" data-set="autoplay" ${s.autoplay ? 'checked' : ''}></div>
    </section>
    <section class="card">
      <h2>소리</h2>
      <div class="set-row" style="border-top:0"><span>목소리 A</span><select data-voice="voiceA">${vOpts('voiceA')}</select></div>
      <div class="set-row"><span>목소리 B <span class="muted sm">(대화 상대)</span></span><select data-voice="voiceB">${vOpts('voiceB')}</select></div>
      <div class="set-row"><div><div>사용 가능한 영어 목소리</div><div class="set-sub">${voices.length}개${voices.some((v) => /ava/i.test(v.name)) ? ' · Ava 있음' : ''}</div></div><button class="btn sm" data-act="refreshVoices">목록 새로고침</button></div>
      <div class="set-row"><span>속도 <b id="rateV">${s.rate.toFixed(2)}</b></span><input type="range" min="0.6" max="1.2" step="0.05" value="${s.rate}" id="rate"></div>
      <div class="set-row"><div><div>전체 듣기에서 한국어도 읽기</div><div class="set-sub">한국어 → 영어 순서로 (책 MP3처럼)</div></div><input type="checkbox" class="sw" data-set="readKo" ${s.readKo ? 'checked' : ''}></div>
      <div class="set-row"><span>영어 반복 횟수</span><div class="seg">${[1, 2, 3].map((n) => `<button data-act="setRepeat" data-n="${n}" class="${s.repeat === n ? 'on' : ''}">${n}번</button>`).join('')}</div></div>
      <button class="btn block" data-act="testVoice">목소리 들어보기</button>
      <p class="hint">더 자연스러운 목소리: 설정 앱 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 영어에서 'Ava (프리미엄)'을 내려받아 선택해 두세요. 받은 뒤에는 이 앱을 완전히 종료했다가(앱 전환 화면에서 위로 밀기) 다시 열어야 목록에 나타나요. 목록에 끝내 없으면 '아이폰 기본 목소리'를 고르세요.</p>
    </section>
    <section class="card">
      <h2>데이터</h2>
      <div class="set-row" style="border-top:0"><span>책 데이터</span><span class="muted">패턴 ${BOOK.patterns.length}개</span></div>
      <div class="set-row"><span>학습 기록</span><span class="muted">완료 ${Object.keys(P.done).length} · 카드 ${cardsN}</span></div>
      <label class="btn block">책 데이터 다시 불러오기<input type="file" id="reimport" accept=".json,application/json" hidden></label>
      <button class="btn block danger" data-act="resetProgress">학습 기록 초기화</button>
      <p class="hint">기록은 이 기기의 이 앱 안에만 저장됩니다. 홈 화면 앱과 Safari는 저장 공간이 따로라서, 한쪽에서만 쓰는 걸 추천해요.</p>
    </section>`;
  $$('[data-set]').forEach((c) => (c.onchange = () => { s[c.dataset.set] = c.checked; save(); }));
  $$('[data-voice]').forEach((sel) => (sel.onchange = () => { s[sel.dataset.voice] = sel.value; save(); say('Hello! Let’s practice English patterns today.', sel.dataset.voice === 'voiceB' ? 'B' : 'A'); }));
  $('#rate').oninput = (e) => { s.rate = +e.target.value; $('#rateV').textContent = s.rate.toFixed(2); save(); };
  $('#reimport').onchange = (e) => importFile(e.target.files[0]);
}
TTS.onChange(() => { if (location.hash === '#/settings' && BOOK) viewSettings(); });
ACT.setPer = (el) => { P.settings.perDay = +el.dataset.n; save(); $$('[data-act="setPer"]').forEach((b) => b.classList.toggle('on', b === el)); };
ACT.setRepeat = (el) => { P.settings.repeat = +el.dataset.n; save(); $$('[data-act="setRepeat"]').forEach((b) => b.classList.toggle('on', b === el)); };
ACT.refreshVoices = () => { TTS.refresh(); viewSettings(); toast(`영어 목소리 ${TTS.ranked().length}개`); };
ACT.testVoice = () => playItems([enItem('Hi, how are you doing today?', null, 'A'), enItem('Pretty good, thanks. How about you?', null, 'B')]);
ACT.resetProgress = () => {
  if (!confirm('학습 완료 표시, 복습 카드, 오답 노트, 연속 학습 기록을 모두 지울까요? 되돌릴 수 없습니다.')) return;
  const settings = P.settings;
  P = { done: {}, fav: {}, cards: {}, wrong: {}, days: {}, tests: {}, daily: null, settings };
  save(); toast('학습 기록을 초기화했습니다'); go('#/');
};

// ================= 시작 =================
if (BOOK && validBook(BOOK)) indexBook(); else BOOK = null;
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
